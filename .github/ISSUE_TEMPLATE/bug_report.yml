name: "🐛 Bug Report"
description: "File a bug or unexpected behavior in 10xGraph"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
        Before reporting, please verify that the bug hasn't already been reported in [existing issues](https://github.com/10xGraph/10xgraph/issues).

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When running a graph with Redis checkpointer, worker timeout causes..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproducible Code Snippet
      description: |
        Provide a self-contained, minimal Python script that demonstrates the problem.
        Do NOT paste real production API keys or proprietary secrets.
      placeholder: |
        ```python
        from 10xgraph import StateGraph

        # Minimal reproduction steps
        ```
      render: python
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 10xGraph Version
      placeholder: "e.g. 0.9.2"
    validations:
      required: true

  - type: dropdown
    id: python-version
    attributes:
      label: Python Version
      options:
        - "3.12"
        - "3.11"
        - "3.10"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - "Linux / Ubuntu"
        - "macOS (Apple Silicon)"
        - "macOS (Intel)"
        - "Windows 11 / WSL2"
        - "Docker Container"
    validations:
      required: true

  - type: dropdown
    id: checkpointer
    attributes:
      label: Checkpointer Backend
      options:
        - "Redis Checkpointer"
        - "PostgreSQL Checkpointer"
        - "Memory Checkpointer"
        - "None / Ephemeral"
    validations:
      required: false

  - type: textarea
    id: traceback
    attributes:
      label: Error Traceback / Logs
      description: Please copy and paste any relevant terminal output or traceback.
      placeholder: "Paste traceback here..."
      render: shell

  - type: checkboxes
    id: confirmation
    attributes:
      label: Pre-Submission Checklist
      options:
        - label: "I have searched existing issues to ensure this is not a duplicate."
          required: true
        - label: "I have confirmed this is not a question (questions belong in GitHub Discussions)."
          required: true
        - label: "I have sanitized all sensitive tokens, keys, and URLs from logs and snippets."
          required: true
